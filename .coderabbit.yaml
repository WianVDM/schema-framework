# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
reviews:
  profile: "chill"
  auto_review:
    enabled: true
    base_branches:
      - "main"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  instructions: |
    ## Project Philosophy

    This is a Data-Driven UI Framework inspired by Ext.NET's configurability. The backend owns JSON Schemas (metadata defining grids and forms); the React frontend owns rendering. Screens change per customer, permission, or workflow without deploying frontend code.

    The framework uses a strict 3-Layer Architecture with one-way dependency chain:
    - Layer 1 (primitives): Generic, schema-agnostic UI wrappers + PrimitiveComponents interface + PrimitivesContext
    - Layer 2 (engine): Schema system — TypeScript types, Zod validators, SchemaForm/SchemaGrid renderers, FieldRenderer switchboard
    - Layer 3 (composition/showcase): TanStack Start routes, server functions, Zustand stores, shadcn/ui wiring via PrimitivesProvider

    Key patterns:
    - Shadcn Dependency Rule: packages/core CANNOT import shadcn directly — uses PrimitivesContext injection
    - Immutability: ReadonlyDeep<T> at compile-time, deepFreeze<T>() at runtime, branded types (FieldId, DataKey)
    - State: TanStack Query (data + metadata), TanStack Form (dirty state), TanStack Table (grid state), Zustand (selection)
    - Serialization: All server function return values must be JSON-serializable (no functions, no ReactNode)

  path_instructions:
    - path: "packages/core/src/primitives/**"
      instructions: |
        LAYER 1 — Primitives (The Raw Materials).

        These are generic, highly reusable component wrappers. They have ZERO knowledge of JSON schemas.

        Rules:
        - NO imports from engine/ — primitives cannot depend on schema system
        - NO imports from Layer 2 or Layer 3
        - Accept standard React props only
        - Exports: PrimitiveComponents interface, PrimitivesContext, bespoke wrappers (StatusBadge, AddressInput, FileUpload)
        - Files must work standalone without any framework context
        - One primary export per file
        - Filenames: kebab-case matching primary export name
        - Barrel files (index.ts) contain ONLY re-exports — no logic, no side-effect imports

    - path: "packages/core/src/engine/**"
      instructions: |
        LAYER 2 — Engine (The Schema Brain).

        Contains the full schema system: TypeScript types, Zod validators, PrimitivesContext provider, and renderers.

        Rules:
        - Import primitives via barrel re-exports ONLY (@/primitives or ../primitives, never direct primitive files)
        - Cross-engine subdomain imports MUST go through barrel files (../validators, not ../validators/some-file)
        - NO imports from Layer 3 (apps/showcase)
        - FieldRenderer reads schema type and renders injected component from PrimitivesContext
        - SchemaGrid uses @tanstack/react-table under the hood
        - SchemaForm uses @tanstack/react-form for field-level validation and conditional visibility
        - GridColumnSchema intentionally has NO render property — custom cell rendering is client-side
        - FieldSchema.defaultValue is string | number | boolean | null (not unknown) for JSON serialization
        - One primary export per file, kebab-case filenames
        - Barrel files contain ONLY re-exports

        TypeScript strictness:
        - No any — use unknown, union types, or generic constraints
        - No as unknown as X double assertions — fix the interface
        - No non-null assertions (!.) — use optional chaining or type guards
        - Use as Type syntax in TSX files (angle bracket assertions conflict with JSX)

        React patterns:
        - No console.assert in components — use error boundaries
        - No inline array/object literals in JSX props — extract to constants or useMemo
        - No inline arrow functions in event handlers — extract to named handlers or useCallback
        - No string refs — use useRef() or callback refs
        - Always provide key props when rendering lists with .map()

    - path: "apps/showcase/src/**"
      instructions: |
        LAYER 3 — Composition (The Showcase App).

        TanStack Start file-based routes, mock server functions, Zustand stores, and shadcn/ui wiring.

        Rules:
        - Uses TanStack Start — do NOT use Next.js App Router conventions
        - Uses createServerFn for server functions
        - TanStack Query (useQuery) for fetching schemas + business data
        - Zustand stores for UI selection state — use generic createSelectionStore pattern, not feature-specific stores
        - primitives-provider.tsx maps shadcn/ui components to PrimitiveComponents interface
        - Mock data uses typed interfaces (UserRow, OrderRow) with readonly properties — not Record<string, unknown>[]
        - Mock schemas are wrapped with deepFreeze<T>()
        - Server function return values must be JSON-serializable (no functions, no ReactNode)

        React patterns:
        - No inline array/object literals in JSX props — extract to constants or useMemo
        - No inline arrow functions in event handlers — extract to named handlers or useCallback
        - No string refs — use useRef() or callback refs

    - path: "packages/core/src/engine/types/**"
      instructions: |
        Schema type definitions — one export per file.
        - All properties use readonly
        - Arrays and nested objects use ReadonlyDeep<T>
        - Branded types for FieldId and DataKey (prevent string interchange)
        - String literal unions for ConditionOperator, ValidationType (no bare string)
        - Must be JSON-serializable (no function types, no ReactNode)

    - path: "packages/core/src/engine/validators/**"
      instructions: |
        Zod validators — one export per file.
        - Validators mirror the type definitions exactly
        - Use z.literal() and z.union() for string literal union types
        - Cross-reference types from ../types via barrel import

    - path: "scripts/**"
      instructions: |
        Build automation, compliance checks, and the auto-changeset system.

        Directory structure:
        - scripts/checks/ — Hook-consumed check modules (biome, rules, changeset, context, typescript)
        - scripts/auto-changeset/ — Full changeset generation system (changeset-writer.mjs, git-operations.mjs, version-bump.mjs, index.mjs)
        - scripts/shared/ — Cross-cutting utilities (file-helpers.mjs, constants.mjs, hook-io.mjs, etc.)
        - scripts/compliance-check/ — Standalone compliance orchestrator
        - scripts/generate-ai-context/ — .context.json generation system

        Rules:
        - All imports use relative paths within scripts/ (../auto-changeset/, ../shared/)
        - auto-changeset modules exist and are fully implemented — do NOT flag imports as missing
        - version-bump.mjs exports resolveBumpLevel(), validateChangesetBump(), readCoreVersion()
        - changeset-writer.mjs exports generateChangeset(), writeChangeset()
        - git-operations.mjs exports getChangedCoreFiles(), getFileDiff()
        - shared/file-helpers.mjs exports readPackageJson() and isSourceFile()

  path_filters:
    - "packages/core/src/**"
    - "apps/showcase/src/**"
    - ".clinerules/**"
    - "scripts/**"

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/.clinerules/*"
      - "ARCHITECTURE.md"
      - "docs/decisions/**"
      - "docs/VERSION_STATUS.md"
      - "docs/context-map.md"
  pull_requests:
    scope: local
  issues:
    scope: local
  web_search:
    enabled: true
  learnings:
    scope: auto

chat:
  auto_reply: true
  art: false

tools:
  biome:
    enabled: true
  github-checks:
    enabled: true