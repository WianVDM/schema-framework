name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # NOTE: changesets/action outputs published packages as JSON.
          # Create a GitHub Release for each published package version.
          PACKAGES='${{ steps.changesets.outputs.publishedPackages }}'
          echo "Published packages: $PACKAGES"

          # Extract the core package version for the release tag
          CORE_VERSION=$(echo "$PACKAGES" | node -e "
            const data = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8'));
            const core = data.find(p => p.name === '@my-framework/core');
            if (core) console.log(core.version);
          " 2>/dev/null || true)

          if [ -z "$CORE_VERSION" ]; then
            echo "No @my-framework/core package found in published output — skipping release creation"
            exit 0
          fi

          TAG="v${CORE_VERSION}"
          echo "Creating GitHub Release for tag: $TAG"

          # Check if tag already exists
          if git tag -l "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists — skipping release creation"
            exit 0
          fi

          # Extract changelog section for this version
          CHANGELOG=""
          if [ -f "packages/core/CHANGELOG.md" ]; then
            CHANGELOG=$(awk "/^## ${CORE_VERSION}/{flag=1; next} /^## /{flag=0} flag" packages/core/CHANGELOG.md | head -100)
          fi

          BODY="${CHANGELOG:-Automated release for version ${CORE_VERSION}}"

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$BODY" \
            --target main