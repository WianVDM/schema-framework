name: Release

on:
  # NOTE: Direct push trigger on main is intentional for the solo-developer 0.x.x phase.
  # CI (build) runs within the release job itself, so every push is validated.
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check for pending changesets
        id: check-changesets
        run: |
          COUNT=$(find .changeset -name '*.md' ! -name 'README.md' | wc -l)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
            echo "Found $COUNT pending changeset(s)"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets — skipping changesets action"
          fi

      # NOTE: npm publishing is disabled during the 0.x.x development phase.
      # Re-enable by adding `publish: pnpm changeset publish` and configuring
      # the NPM_TOKEN secret when ready to publish (target: v1.0.0).
      - name: Create Release Pull Request or Version
        if: steps.check-changesets.outputs.has_changesets == 'true'
        id: changesets
        uses: changesets/action@v1
        with:
          version: node scripts/version-packages.mjs
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}

      - name: Enable auto-merge for Version Packages PR
        if: steps.changesets.outputs.hasChangesets == 'true'
        env:
          GH_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head changeset-release/main --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            echo "Enabling auto-merge for PR #$PR_NUMBER"
            gh pr merge "$PR_NUMBER" --auto --merge
          else
            echo "No open Version Packages PR found — skipping auto-merge"
          fi

      - name: Create GitHub Release
        if: steps.check-changesets.outputs.has_changesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}
        run: |
          # NOTE: Since npm publishing is disabled, we read the version directly
          # from packages/core/package.json and create a GitHub Release if one
          # doesn't already exist for this version.
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")

          if [ -z "$CORE_VERSION" ]; then
            echo "Could not read version from packages/core/package.json — skipping release creation"
            exit 0
          fi

          TAG="v${CORE_VERSION}"
          echo "Checking GitHub Release for tag: $TAG"

          # Check if release already exists on GitHub remote
          if gh release view "$TAG" 2>/dev/null; then
            echo "Release for tag $TAG already exists — skipping release creation"
            exit 0
          fi

          echo "Creating GitHub Release for tag: $TAG"

          # Extract changelog section for this version
          CHANGELOG=""
          if [ -f "packages/core/CHANGELOG.md" ]; then
            ESCAPED_VERSION=$(printf '%s' "$CORE_VERSION" | sed 's/[.^$*+?{}[\]|()\\]/\\&/g')
            CHANGELOG=$(awk "/^## ${ESCAPED_VERSION}/{flag=1; next} /^## /{flag=0} flag" packages/core/CHANGELOG.md | head -100)
          fi

          BODY="${CHANGELOG:-Automated release for version ${CORE_VERSION}}"

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$BODY" \
            --target main